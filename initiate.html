<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

<body class="initiate-page">
  <div class="initiate-section">
    <div class="initiate-content">
      <div class="initiate-text">
        Pre-sale starts on Aug&nbsp;20th&nbsp;22:00&nbsp;UTC
        <br>Minting price: 0.02 ETH
        <br><span class="initiate-timer" id="initiate-timer">0:0:0:0</span>
      </div>
      <div class="initiate-list">
        <div class="initiate-list-header">Early member benefits</div>
        <div class="initiate-list-item">NFT and ETH airdrops</div>
        <div class="initiate-list-item">Lower requirements for Angel minting</div>
        <div class="initiate-list-item">Early access to the Raccoon Lodge</div>
      </div>
    </div>
    <div class="initiate-btn-group">
      <div class="btn initiate-connect" id="initiate-connect">Connect</div>
      <div class="initiate-minus" id="initiate-minus"></div>
      <input type="text" class="initiate-input" id="initiate-input" value="1">
      <div class="btn btn-disabled initiate-confirm" id="initiate-confirm">Mint</div>
      <div class="initiate-plus" id="initiate-plus"></div>
    </div>
  </div>
  <script type="text/javascript" src="https://unpkg.com/web3@latest/dist/web3.min.js"></script>
  <script type="text/javascript" src="https://unpkg.com/web3modal"></script>
  <script type="text/javascript" src="https://unpkg.com/evm-chains@0.2.0/dist/umd/index.min.js"></script>
  <script type="text/javascript" src="https://unpkg.com/@walletconnect/web3-provider"></script>
  <script type="text/javascript" src="https://unpkg.com/fortmatic@2.0.6/dist/fortmatic.js"></script>
  <script type="text/javascript" src="/web3.js"></script>
</body>
